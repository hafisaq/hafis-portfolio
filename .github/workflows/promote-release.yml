name: Promote release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-v1
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge replica into release
        run: |
          git fetch origin replica release/v1
          git merge --no-ff origin/replica -m "chore(release): merge replica into release/v1"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Validate release
        run: |
          npm run lint
          npm run build

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): bump version"

      - name: Push release
        run: git push origin HEAD:release/v1
